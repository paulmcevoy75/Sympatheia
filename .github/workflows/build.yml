name: Build & test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner (platform folder is not committed)
        shell: bash
        run: |
          flutter create --platforms=windows --project-name sympatheia --org com.paulmcevoy .
          rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Resolved package versions
        shell: bash
        run: flutter pub deps --style=compact | tee deps.txt

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          echo '### flutter analyze' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 analyze.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.txt

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: Sympatheia-windows
          path: build/windows/x64/runner/Release/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: logs
          path: |
            analyze.txt
            test.txt
            deps.txt
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (platform folder is not committed)
        run: |
          flutter create --platforms=android --project-name sympatheia --org com.paulmcevoy .
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          # Microphone permission + app name
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <application#' "$M"
          sed -i 's#android:label="sympatheia"#android:label="Sympatheia"#' "$M"
          cat "$M"

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: Sympatheia-android
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: [windows, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          cp Sympatheia-android/app-release.apk Sympatheia.apk
          (cd Sympatheia-windows && zip -qr ../Sympatheia-windows.zip .)
          gh release delete latest -R "$REPO" -y --cleanup-tag || true
          gh release create latest -R "$REPO" \
            --title "Sympatheia (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Android: tap Sympatheia.apk. Windows: download the zip, unzip, run sympatheia.exe." \
            --target "$GITHUB_SHA" \
            Sympatheia.apk Sympatheia-windows.zip
